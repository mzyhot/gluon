name: Build

# Builds the Windows runtime from published open-source code on an Apple Silicon runner
# (see packaging/build-runtime.sh), then the installer package. A manual run uploads the
# package as a workflow artifact; pushing a tag vX.Y.Z also publishes a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the package name (e.g. 0.3.0-dev)
        required: true
        default: 0.0.0-dev
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      JOBS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Build tools
        run: brew install bison flex cmake pkg-config

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('packaging/build-runtime.sh') }}

      - name: Steam bridge input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/inputs
          gh release download runtime-inputs-1 -R "$GITHUB_REPOSITORY" -p 'steam-bridge-*.tar.gz*' -D build/inputs || echo "no Steam bridge input published"
          if ls build/inputs/*.sha256 >/dev/null 2>&1; then (cd build/inputs && shasum -a 256 -c ./*.sha256); fi

      - name: Build Steam Play integration
        run: steamplay/build.sh

      - name: Test Steam Play installation and launcher fixtures
        run: |
          python3 -m unittest discover -s tests -v
          python3 steamplay/check-bundle.py

      - name: Build runtime
        run: packaging/build-runtime.sh

      - name: Compile OpenGL probes
        run: |
          packaging/check-opengl.sh --compile-only arm64 x86_64
          mkdir -p build/graphics-probes
          clang -arch x86_64 -O2 -Wall -Wextra -Werror packaging/check-opengl.c \
            -framework OpenGL -o build/graphics-probes/opengl-native
          for arch in x86_64 i686; do
            "build/llvm-mingw/bin/$arch-w64-mingw32-clang" -O2 -Wall -Wextra -Werror \
              packaging/check-wgl.c -lopengl32 -lgdi32 -luser32 \
              -o "build/graphics-probes/wgl-$arch.exe"
            "build/llvm-mingw/bin/$arch-w64-mingw32-clang" -O2 -Wall -Wextra -Werror \
              tools/d3d9_probe.c -lgdi32 -luser32 \
              -o "build/graphics-probes/d3d9-$arch.exe"
            "build/llvm-mingw/bin/$arch-w64-mingw32-clang" -O2 -Wall -Wextra -Werror \
              packaging/probes/runtime-dependencies.c -lsecur32 \
              -o "build/graphics-probes/dependencies-$arch.exe"
          done

      - name: Preserve completed runtime and compiled probes
        run: |
          shasum -a 256 packaging/check-opengl.c packaging/check-wgl.c \
            packaging/probes/vulkan.c packaging/probes/runtime-dependencies.c \
            tools/d3d9_probe.c > build/probe-sources.sha256
          COPYFILE_DISABLE=1 tar -czf build/completed-runtime-input.tar.gz \
            build/gluon-wine build/graphics-probes build/probe-sources.sha256
          (cd build && shasum -a 256 completed-runtime-input.tar.gz > completed-runtime-input.tar.gz.sha256)

      - name: Upload completed runtime for bounded rechecks
        uses: actions/upload-artifact@v4
        with:
          name: completed-runtime-input
          path: |
            build/completed-runtime-input.tar.gz
            build/completed-runtime-input.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Check complete runtime on GitHub macOS
        timeout-minutes: 8
        run: python3 packaging/run-cloud-probes.py build/gluon-wine build/graphics-probes

      - name: Build logs on failure
        if: failure()
        run: |
          for f in build/wine-build/config.log build/freetype-build/CMakeFiles/CMakeError.log; do
            if [ -f "$f" ]; then echo "::group::$f (tail)"; tail -n 150 "$f"; echo "::endgroup::"; fi
          done

      - name: Package
        run: |
          GLUON_PKG_RUNTIME="$PWD/build/gluon-wine" packaging/build-pkg.sh "${{ steps.version.outputs.version }}"
          (cd dist && shasum -a 256 Gluon-*.pkg > "Gluon-${{ steps.version.outputs.version }}.pkg.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: Gluon-${{ steps.version.outputs.version }}
          path: |
            dist/Gluon-*.pkg*
            dist/Gluon-SteamPlay-source.tar.gz
          if-no-files-found: error

      - name: Graphics build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-build-evidence
          path: |
            build/graphics-probes/*.log
            build/graphics-probes/*.json
            build/graphics-probes/*.exe
            build/d3d9/*/pe-inspection.txt
            build/d3d9/*/meson-logs/meson-log.txt
            build/tls-build/*/config.log
            build/tls-build/smoke.log
            build/media-build/*/meson-logs/meson-log.txt
            build/media-build/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Gluon-*.pkg dist/Gluon-*.pkg.sha256 dist/Gluon-SteamPlay-source.tar.gz \
            --title "Gluon ${{ steps.version.outputs.version }}" --generate-notes --prerelease
