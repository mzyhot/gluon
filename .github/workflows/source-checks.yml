name: Source checks

# Source validation and isolated string fixtures; no Wine or graphics probes run.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "codex/**"]

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  steam-compat:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the resolver against synthetic images
        run: packaging/check-steam-compat.sh

      - name: Build read-only compatibility probe
        run: packaging/build-steam-compat.sh

      - name: Preserve developer probe
        uses: actions/upload-artifact@v4
        with:
          name: steam-compat
          path: build/steam-compat/libgluon-steam-compat.dylib
          if-no-files-found: error
          retention-days: 7

  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GLUON_CLOUD_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check installation recovery and metadata protection
        run: timeout 60s python3 -m unittest discover -s tests -v

      - name: Cache verified source downloads
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: source-downloads-${{ hashFiles('packaging/build-runtime.sh', 'packaging/check-opengl-aliases.sh') }}

      - name: Check syntax, source patches, and alias signatures
        shell: bash
        run: |
          mkdir -p build/source-checks
          timeout 19m bash packaging/check-sources.sh 2>&1 | tee build/source-checks/result.log

      - name: Source check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-checks-${{ github.run_id }}
          path: build/source-checks/result.log
          if-no-files-found: ignore
          retention-days: 7
